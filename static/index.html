<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Trail — Canvas Platformer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #122937; color: #edf8fb; font-family: monospace; }
    main { width: min(850px, 100%); padding: 24px; }
    h1 { margin: 0 0 8px; color: #ffd447; font-size: 30px; }
    p { line-height: 1.6; }
    canvas { display: block; width: 100%; height: auto; border: 4px solid #315468; border-radius: 8px; }
    footer { color: #b9d3de; font-size: 13px; line-height: 1.6; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>TINY TRAIL</h1>
    <p>A little leap, a pocket of gold. Reach the red flag!</p>
    <canvas id="game" width="800" height="480" aria-label="Platform game. Use arrow keys or A and D to move, Space to jump, R to restart.">Your browser needs canvas support to play.</canvas>
    <footer>MOVE: ← → / A D &nbsp; JUMP: SPACE / ↑ / W &nbsp; RESTART: R<br>Collect coins. Jump the gaps. Find the flag. Keyboard required.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
